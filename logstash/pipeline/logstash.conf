# 2025-07-18 14:02:26,940 DEBUG [profiler.websocket] StateWebSocket instance number -------> 119
# 2025-07-18 14:18:37,557 DEBUG [ServerDiag] UDP client - coda sforata
#
# "^%{TIMESTAMP_ISO8601:timestamp} %{DATA:log_level} Eccezione: %{DATA:eccezione}",
