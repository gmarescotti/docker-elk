    #     }
    #     event.set("disc_array", arr)
    #   '
    # }

    # 4️⃣ Ruby regex scan per catturare tutte le righe SAI DISC.ind[...] in un array
    ruby {
      code => '
        require "digest"

        text = event.get("[event][original]") || ""
        disc_array = []

        # Leggi riga per riga
        text.each_line do |line|
          # Match SOLO righe tipo: "SA DISC.ind[3]: Scaduto timer testAB"
          if line =~ /^(\w+)\s+(\w+)\.ind\[(\d+)\]:\s*(.+)$/
            m = Regexp.last_match
            disc_array << {
              "proto" => m[1],        # es. "SA"
              "evento" => m[2],       # es. "DISC"
              "disc_ind" => m[3].to_i,# es. 3
              "message_keyword" => m[4].strip # es. "Scaduto timer testAB"
            }
          end
        end

        event.set("disc_array", disc_array)

        if disc_array && !disc_array.empty?

          signature = disc_array.map do |d|
            [d[:proto], d[:evento], d[:disc_ind], d[:message_keyword]].join("|")
          end.sort.join(";")
          event.set("disc_array_hash", Digest::MD5.hexdigest(signature))
          
        end
      '
    }

    mutate {
      convert => {
        "sn_comm_int" => "integer"
        "sn_local_int" => "integer"
        "disc_ind" => "integer"
      }
