      tag_on_failure => ["_grokparsefailure"]
    }

    grok {
      match => { "message" => "\[GestisciRuoloNV\] Ruolo BF_RUOLO_%{DATA:ruolo} - SN\(comm\): %{INT:sn_comm_int} - SN\(local\): %{INT:sn_local_int} %{GREEDYDATA:rest2}" }
      tag_on_failure => ["_grokparsefailure2"]
    }

    # # 1️⃣ Split sulle righe
