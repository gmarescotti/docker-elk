filter {

  mutate {
    gsub => [
      "message", "\t", " "
    ]
  }

  # Step 2: Rimuove \r e \n
  mutate {
    gsub => [
      "message", "[\r\n]", ""
    ]
  }

  grok {
    pattern_definitions => {
      "LETTERS_AND_DOT" => "[A-Za-z\.]+"
      "NEXT_MINUS" => "[^-]+"
    }
    match => { "message" => "^%{TIMESTAMP_ISO8601:timestamp} %{DATA:log_level} \[%{LETTERS_AND_DOT:log_source}\] manage allarmi:%{INT:manage_allarmi} MapSize %{INT:mapsize} Alarm Size %{INT:alarm_size} %{LETTERS_AND_DOT:giorno} %{NEXT_MINUS:mytimestamp}- %{INT:durata_manage_allarmi} Manage Degrado Time:%{INT:degrado_time} Manage Mastership Time:%{INT:mastership.time} Manage All Time:%{INT:mastership.all_time} MASTERSHIP Status:%{LETTERS_AND_DOT:mastership.status} DEGRADO Status:%{INT:mastership.degrado}%{GREEDYDATA:giulio}" }

    tag_on_failure => ["_grokparsefailure"]
  }

  mutate {
    convert => {
      "mastership.all_time" => "integer"
    }
    convert => {
      "mastership.degrado" => "integer"
    }
    convert => {
      "mastership.time" => "integer"
    }
    convert => {
      "durata_manage_allarmi" => "integer"
    }
    convert => {
      "degrado_time" => "integer"
    }
  }

  if "_grokparsefailure" in [tags] {
    drop { }
  }

  date {
    match => ["mytimestamp", "MMM dd HH:mm:ss Z yyyy"]
    target => "mytimestamp"
    timezone => "UTC"
  }
}

output {
	elasticsearch {
		hosts => "elasticsearch:9200"
		user => "logstash_internal"
		password => "${LOGSTASH_INTERNAL_PASSWORD}"
	}
}

