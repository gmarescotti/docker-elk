      tag_on_failure => ["_other"]
    }  

    if "_other" in [tags] {
      grok {
        match => { "message" => "Eccezione: %{JAVACLASS:exception}%{GREEDYDATA:stacktrace}" }
        add_tag => ["stacktrace"]
